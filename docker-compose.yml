version: '3.8'

services:
  facial-processing-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facial-processing-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    volumes:
      # Mount for development (comment out for production)
      - ./src:/app/src
      - ./api:/app/api
      # Optional: Mount for data files
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - facial-processing-network

networks:
  facial-processing-network:
    driver: bridge


